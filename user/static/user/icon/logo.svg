<svg width="64" height="64" viewBox="0 0 64 64" xmlns="http://www.w3.org/2000/svg" role="img" aria-labelledby="emberLogoTitle" xmlns:c2pa="http://c2pa.org/manifest"><metadata><c2pa:manifest></c2pa:manifest></metadata>
  <title id="emberLogoTitle">Ember</title>
  <defs>
    <linearGradient id="hexGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#e3c785"/>
      <stop offset="50%" stop-color="#c9a961"/>
      <stop offset="100%" stop-color="#8f7943"/>
    </linearGradient>
    <linearGradient id="flameOuter" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#e3c785"/>
      <stop offset="55%" stop-color="#c9a961"/>
      <stop offset="100%" stop-color="#8f7943"/>
    </linearGradient>
    <linearGradient id="flameInner" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#11151d"/>
      <stop offset="100%" stop-color="#0a0d12"/>
    </linearGradient>
  </defs>

  <!-- outer badge hexagon -->
  <polygon points="32,5 55.4,18.5 55.4,45.5 32,59 8.6,45.5 8.6,18.5"
           fill="#11151d" stroke="url(#hexGrad)" stroke-width="1.4" stroke-linejoin="round"/>

  <!-- inner bezel hexagon -->
  <polygon points="32,10 51.05,21 51.05,43 32,54 12.95,43 12.95,21"
           fill="none" stroke="#242b38" stroke-width="1"/>

  <!-- corner rivets -->
  <g fill="#8f7943" opacity="0.85">
    <circle cx="32" cy="5" r="1.3"/>
    <circle cx="55.4" cy="18.5" r="1.3"/>
    <circle cx="55.4" cy="45.5" r="1.3"/>
    <circle cx="32" cy="59" r="1.3"/>
    <circle cx="8.6" cy="45.5" r="1.3"/>
    <circle cx="8.6" cy="18.5" r="1.3"/>
  </g>

  <!-- ember / flame mark -->
  <path d="M32 15
           C 25.5 23, 21.3 29.2, 22.2 36.2
           C 23 41.8, 27.1 46, 32 46
           C 36.9 46, 41 41.8, 41.8 36.2
           C 42.7 29.2, 38.5 23, 32 15 Z"
        fill="url(#flameOuter)"/>

  <path d="M32 25
           C 28.4 29.7, 26.6 33.2, 27.3 37
           C 27.9 40.3, 29.8 42.3, 32 42.3
           C 34.2 42.3, 36.1 40.3, 36.7 37
           C 37.4 33.2, 35.6 29.7, 32 25 Z"
        fill="url(#flameInner)"/>

  <ellipse cx="32" cy="37" rx="3.3" ry="4.2" fill="#c9a961" opacity="0.9"/>
</svg>
